name: Build Equicrew Frontend Container

on:
  push:
    branches:
      - eq-dev
      - eq-main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get HA base image for architecture
        id: base_image
        run: |
          case "${{ matrix.arch }}" in
            aarch64) echo "image=ghcr.io/home-assistant/aarch64-base:3.20" >> $GITHUB_OUTPUT ;;
            amd64) echo "image=ghcr.io/home-assistant/amd64-base:3.20" >> $GITHUB_OUTPUT ;;
            armv7) echo "image=ghcr.io/home-assistant/armv7-base:3.20" >> $GITHUB_OUTPUT ;;
            armhf) echo "image=ghcr.io/home-assistant/armhf-base:3.20" >> $GITHUB_OUTPUT ;;
            i386) echo "image=ghcr.io/home-assistant/i386-base:3.20" >> $GITHUB_OUTPUT ;;
          esac
      
      - name: Get Docker platform for architecture
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            aarch64) echo "platform=linux/arm64" >> $GITHUB_OUTPUT ;;
            amd64) echo "platform=linux/amd64" >> $GITHUB_OUTPUT ;;
            armv7) echo "platform=linux/arm/v7" >> $GITHUB_OUTPUT ;;
            armhf) echo "platform=linux/arm/v6" >> $GITHUB_OUTPUT ;;
            i386) echo "platform=linux/386" >> $GITHUB_OUTPUT ;;
          esac
      
      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' eq-frontend/config.yaml | cut -d'"' -f2)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: eq-frontend/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          build-args: |
            BUILD_FROM=${{ steps.base_image.outputs.image }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eq-frontend-${{ matrix.arch }}:latest
            ghcr.io/${{ github.repository_owner }}/eq-frontend-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          no-cache: true
