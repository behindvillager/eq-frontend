name: "Equicrew Frontend"
version: "2024.12.0-eq8"
slug: eq-frontend
description: "Custom Equicrew Home Assistant Frontend based on Home Assistant 2024.12"
url: https://github.com/behindvillager/eq-frontend
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
image: ghcr.io/behindvillager/eq-frontend-{arch}
homeassistant_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Frontend HTTP port"
